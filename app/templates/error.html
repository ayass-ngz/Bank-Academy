{% extends "base.html" %}
{% block title %}Erreur {{ code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <div class="display-4 text-brand fw-bold">{{ code }}</div>
  {% if code == 403 %}
    <p class="lead">{{ message or "Tu n'as pas accès à cette page." }}</p>
  {% else %}
    <p class="lead">Cette page n'existe pas (ou plus).</p>
  {% endif %}
  <a href="{{ url_for('main.index') }}" class="btn btn-brand mt-2">Retour à l'accueil</a>
</div>
{% endblock %}
